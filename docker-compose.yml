version: '3.8'

services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:15
    container_name: kkokkaot_postgres
    environment:
      POSTGRES_DB: kkokkaot_closet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 000000
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./API/휴지통/postgresql.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - kkokkaot_network

  # 메인 애플리케이션
  app:
    build: ./API
    container_name: kkokkaot_app
    ports:
      - "4000:4000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=kkokkaot_closet
      - DB_USER=postgres
      - DB_PASSWORD=000000
      - READONLY_DB_PASSWORD=readonly123
    volumes:
      - ./API/pre_trained_weights:/app/pre_trained_weights
      - ./API/chroma_db:/app/chroma_db
      - ./API/uploaded_images:/app/uploaded_images
      - ./API/processed_images:/app/processed_images
    depends_on:
      - postgres
    networks:
      - kkokkaot_network

  # 프론트엔드 (선택사항)
  frontend:
    build: ./project
    container_name: kkokkaot_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:4000}
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - app
    networks:
      - kkokkaot_network

volumes:
  postgres_data:

networks:
  kkokkaot_network:
    driver: bridge
